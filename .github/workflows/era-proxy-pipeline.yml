name: Era Large File Proxy Pipeline

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/era-proxy-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-proxy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: A-roll-speaking-head
            file_id: 160wjBnqkw6ra_eYuL0RjiZfmLtm5DSRI
          - label: B-roll-screencast
            file_id: 1Xe3KATYILaq6GPv_JHSWLomHYe4crJL6
          - label: C-roll-top-view
            file_id: 1LS9eD3ReIhBEriRa69Tsi1xm5MYU72HM
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TARGET_MIB: "850"
      LABEL: ${{ matrix.label }}
      FILE_ID: ${{ matrix.file_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Install tools
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade gdown yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download source with Drive preview fallback
        shell: bash
        run: |
          set -uo pipefail
          SOURCE="source-video"
          echo "Trying full Drive download for ${LABEL}"
          if gdown --continue --retries 4 "https://drive.google.com/uc?id=${FILE_ID}" -O "${SOURCE}"; then
            echo "Full-file download succeeded"
          else
            echo "Full-file path quota-blocked; trying Google Drive playable-video stream"
            rm -f "${SOURCE}"
            yt-dlp --no-playlist --retries 8 --fragment-retries 8 \
              -f "best[height<=1080]/best" \
              -o "${SOURCE}" \
              "https://drive.google.com/file/d/${FILE_ID}/view"
          fi
          test -s "${SOURCE}"
          ls -lh "${SOURCE}"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "${SOURCE}"

      - name: Transcode duration-aware proxy under 1 GB
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p era-proxy
          SOURCE="source-video"
          OUTPUT="era-proxy/${LABEL}-proxy.mp4"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "${SOURCE}")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "${SOURCE}")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "${SOURCE}")"
          video_kbps="$(python3 -c 'import sys; seconds=max(float(sys.argv[1]),1.0); target=int(sys.argv[2])*1024*1024; print(max(350,min(3000,int((target*8/seconds/1000)-120))))' "${duration}" "${TARGET_MIB}")"
          if [ "${width}" -ge "${height}" ]; then
            vf="scale='min(1920,iw)':-2,fps=30"
          else
            vf="scale=-2:'min(1920,ih)',fps=30"
          fi
          ffmpeg -hide_banner -y -i "${SOURCE}" \
            -map 0:v:0 -map 0:a? \
            -vf "${vf}" \
            -c:v libx264 -preset veryfast -b:v "${video_kbps}k" \
            -maxrate "$((video_kbps*12/10))k" -bufsize "$((video_kbps*2))k" \
            -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart \
            "${OUTPUT}"
          sha256sum "${OUTPUT}" > "era-proxy/${LABEL}-SHA256.txt"
          ls -lh "${OUTPUT}"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "${OUTPUT}"

      - name: Upload proxy
        uses: actions/upload-artifact@v4
        with:
          name: era-${{ matrix.label }}-proxy
          path: era-proxy/
          compression-level: 0
          retention-days: 7
